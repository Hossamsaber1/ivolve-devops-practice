services:
  db:
    image: mysql:8.0
    container_name: ivolve-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ivolvecd
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  app:
    build: .
    container_name: ivolve-node-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: ivolve
    depends_on:
      - db
    restart: always

volumes:
  db_data: